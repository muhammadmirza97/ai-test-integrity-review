packages:
  - "packages/*"
# Dependency install scripts are denied by default (supply-chain hardening).
# esbuild ships its platform binary through optional dependencies and works without its postinstall.
allowBuilds:
  esbuild: false
# Patched transitive dependencies of the root Vitest toolchain.
overrides:
  "vite@>=8.3.0 <=8.3.2": "8.3.3"
  "source-map-js@<1.2.2": "1.2.2"
  "minimatch@10.2.6": "11.0.1"
