name: Alpha feedback
description: Anything else — noise, speed, wording, what would make you uninstall it.
title: "[feedback] "
labels: ["alpha", "feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Short answers are fine. Skip anything you do not want to answer.

        ⚠️ **Do not paste secrets, tokens, credentials, private source code, or proprietary logs.**
        Everything in this issue is public forever.

  - type: dropdown
    id: stage
    attributes:
      label: Where are you with it?
      options:
        - "I ran the preflight but did not install it"
        - "Installed, no pull requests yet"
        - "Installed, running on real pull requests (advisory)"
        - "Required status check"
        - "I removed it"
    validations:
      required: true

  - type: input
    id: setup
    attributes:
      label: Framework, package manager, Node version
      placeholder: "vitest 4, pnpm, Node 24"
    validations:
      required: false

  - type: input
    id: agent
    attributes:
      label: Which AI coding agent(s) do you use on this repository?
      placeholder: "Claude Code, Codex, Cursor, Copilot, none..."
    validations:
      required: false

  - type: dropdown
    id: install-difficulty
    attributes:
      label: How hard was it to install?
      options:
        - "Copy-paste, worked first time"
        - "Minor fiddling (a few minutes)"
        - "Took real effort (I had to debug it)"
        - "I could not get it working"
        - "I did not install it"
    validations:
      required: false

  - type: input
    id: repos
    attributes:
      label: How many repositories did you try it on?
      placeholder: "1"
    validations:
      required: false

  - type: input
    id: prs
    attributes:
      label: Roughly how many pull requests has it run on?
      placeholder: "about 15"
    validations:
      required: false

  - type: textarea
    id: results
    attributes:
      label: Roughly how did those runs come out?
      description: "For example: 10 PASS, 4 WARN, 0 BLOCK, 1 ERROR."
      placeholder: "PASS: , WARN: , BLOCK: , ERROR: "
    validations:
      required: false

  - type: input
    id: runtime
    attributes:
      label: Roughly how much time did the check add to a pull request?
      placeholder: "about 30 seconds"
    validations:
      required: false

  - type: dropdown
    id: support
    attributes:
      label: Did you need help to get it working or to understand a result?
      options:
        - "No, the docs were enough"
        - "Once"
        - "Two or three times"
        - "More than that"
    validations:
      required: false

  - type: dropdown
    id: keep
    attributes:
      label: Would you keep it enabled as it is today?
      options:
        - "Yes, as a required check"
        - "Yes, advisory only"
        - "Only if the noise dropped"
        - "No"
        - "Undecided"
    validations:
      required: true

  - type: dropdown
    id: recommend
    attributes:
      label: Would you recommend a colleague keep it enabled?
      options:
        - "Yes"
        - "Yes, advisory only"
        - "Not yet"
        - "No"
    validations:
      required: false

  - type: textarea
    id: annoyance
    attributes:
      label: Biggest annoyance
    validations:
      required: false

  - type: textarea
    id: uninstall
    attributes:
      label: What would make you remove it?
    validations:
      required: false

  - type: textarea
    id: missing
    attributes:
      label: What would make it clearly worth keeping?
    validations:
      required: false

  - type: dropdown
    id: willingness-to-pay
    attributes:
      label: "Optional: if this reliably protected your private repositories from AI-related test-integrity problems, would you pay for a managed or team version?"
      description: Asked for planning only. Nothing is for sale, no price has been set, and your answer changes nothing about your access to this alpha.
      options:
        - "Prefer not to answer"
        - "Yes"
        - "Maybe"
        - "No"
    validations:
      required: false

  - type: textarea
    id: willingness-to-pay-why
    attributes:
      label: "If you answered yes or maybe: what would make it worth paying for?"
      description: Skip this if you would rather not say.
    validations:
      required: false

  - type: textarea
    id: anything
    attributes:
      label: Anything else
    validations:
      required: false
